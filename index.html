<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List-You</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="css\style.css">

    <!--Tailwind CSS-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>
<body>
    <!-- Header Content -->
    <header>
        <h1>To-do List-You</h1>
    </header>
    
    <!-- Main content -->
    <main>
        <section>
            <form>
                <!--To-do Input-->
                <input class="border p-2" type="text" id="To-do input" placeholder="Enter a new To-do item">

                <!--Date Input-->
                <input class="border p-2" type="text" id="To-do Date" placeholder="Enter due date">
            </form>

            <!--Add Button-->
            <button class="bg-gray-500 hover:bg-gray-700 text-black font-bold py-2 px-4 rounded" rounded" type="button">Add To-do:D</button>
        </section>
    </main>

    <!-- Footer Content -->
    <footer></footer>
    
    <!-- Javascript External -->
    <script src="js/script.js"></script>
    
</body>
</html>
