<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List-You</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="css\style.css">

    <!--Tailwind CSS-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>
<body>
    <!-- Header Content -->
    <header>
        <h1 class="text-2xl font-semibold">⋆｡°✩To-do Listᶻ 𝗓 𐰁</h1>
    </header>
    
    <!-- Main content -->
    <main>
        <section>
            <form>
                <!--To-do Input-->
                <input class="border p-2" type="text" id="todoInput" placeholder="Enter a new To-do item">

                <!--Date Input-->
                <input class="border p-2" type="text" id="todoDate" placeholder="Enter due date">
            </form>

            <!--Add Button-->
            <button class="bg-gray-500 hover:bg-gray-700 text-black font-bold py-2 px-4 rounded" onclick="addTodo()" type="button">Add To-do:D</button>
        </section>

        <!--Action Button-->
        <section class="flex pt-2 justify-between">
            <!--Clear All Button-->
            <button class="border rounded p-2 bg-red-500 text-white font-bold" onclick="deleteTodos()">Clear All To-dos</button>

            <!--Filter Option-->
            <button class="border rounded p-2 bg-green-500 text-white font-bold" onclick="filterTodos()">Filter To-dos</button>
        </section>

        <!--To-do list section-->
        <section class="pt-2">
            <header>
                <h1 class="text-2xl font-semibold">List of To-dos</h1>
            </header>

            <ul class="pt-2" id="to-do-list">
                <!--To-do items will be dynamically added here-->
                <li>No To-dos available</li>
            </ul>
    </main>

    <!-- Footer Content -->
    <footer>
        <p class="text-center text-gray-500 text-sm mt-4">2026 Made w/love. All Rights Reserved.</p>
    </footer>
    
    <!-- Javascript External -->
    <script src="js/script.js" defer></script>

</body>
</html>
